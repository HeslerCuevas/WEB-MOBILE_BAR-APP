<div class="mb-10 text-center">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-surface-container border border-surface-container-highest shadow-[0_0_30px_rgba(255,107,0,0.1)] mb-6">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">password</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface mb-2 tracking-tight">Reset Password</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">Create a strong, new password to secure your digital sommelier access.</p>
</div>
<form class="flex flex-col gap-6 w-full">
<!-- New Password Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-secondary tracking-widest uppercase ml-1" for="new-password">New Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-surface-container border border-surface-container-highest rounded-xl py-4 pl-12 pr-12 text-on-surface font-body-lg text-body-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-surface-highest" id="new-password" placeholder="Enter new password" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Confirm Password Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-secondary tracking-widest uppercase ml-1" for="confirm-password">Confirm New Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">lock_reset</span>
<input class="w-full bg-surface-container border border-surface-container-highest rounded-xl py-4 pl-12 pr-12 text-on-surface font-body-lg text-body-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-surface-highest" id="confirm-password" placeholder="Confirm new password" type="password">
</div>
</div>
<!-- Submit Action -->
<div class="mt-4">
<button class="w-full bg-gradient-to-r from-primary-container to-[#ff8c33] text-surface-container-lowest font-label-lg text-label-lg py-4 rounded-xl shadow-[0_10px_30px_rgba(255,107,0,0.25)] hover:shadow-[0_15px_40px_rgba(255,107,0,0.4)] active:scale-[0.98] transition-all flex items-center justify-center gap-2 uppercase tracking-wider" type="button">
                    Save Password

</button>
</div>
