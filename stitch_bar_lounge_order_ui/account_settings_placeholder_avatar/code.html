<style>

<body class="text-on-background min-h-screen flex flex-col pb-24 font-body-md antialiased selection:bg-primary-container selection:text-white">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 border-b border-white/10 bg-surface-dim/80 backdrop-blur-md shadow-sm flex items-center justify-between px-card-padding h-16 transition-colors">
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-highest/50 transition-colors active:scale-95 duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md dark:text-primary-container font-extrabold tracking-tight" style="color: rgb(255, 182, 147);">Nocturnal</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 px-container-margin md:max-w-2xl md:mx-auto w-full">
<div class="mb-section-padding">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Account Profile</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Manage your elite credentials and preferences.</p>
</div>
<!-- Profile Avatar Section -->
<div class="flex flex-col items-center mb-section-padding">
<div class="relative group cursor-pointer mb-4">
<div class="w-32 h-32 rounded-full overflow-hidden border-2 border-surface-variant shadow-[0_0_30px_rgba(255,107,0,0.1)] transition-transform group-hover:scale-105 duration-300"><div class="w-full h-full flex items-center justify-center bg-surface-container-highest text-on-surface-variant"><span class="material-symbols-outlined text-[64px]" data-icon="person">person</span></div></div>
<div class="absolute bottom-0 right-0 bg-surface-container-high p-2 rounded-full border border-white/10 shadow-lg text-primary-container group-hover:bg-primary-container group-hover:text-white transition-colors duration-300">
<span class="material-symbols-outlined text-[20px]" data-icon="photo_camera">photo_camera</span>
</div>
</div>
</div>
<!-- Edit Form Section (Bento-style layout for web, stacked for mobile) -->
<form class="space-y-gutter glass-panel p-card-padding rounded-xl mb-section-padding">
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Full Name -->
<div class="flex flex-col space-y-2 md:col-span-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" data-icon="badge">badge</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-surface-variant rounded-lg text-on-surface focus:outline-none focus:ring-0 input-glow transition-all duration-300 font-body-md" id="fullName" placeholder="Enter full name" type="text" value="Alexander Vance">
</div>
</div>
<!-- Email Address -->
<div class="flex flex-col space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" data-icon="mail">mail</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-surface-variant rounded-lg text-on-surface focus:outline-none focus:ring-0 input-glow transition-all duration-300 font-body-md" id="email" placeholder="Enter email address" type="email" value="alexander.vance@elite.co">
</div>
</div>
<!-- Phone Number -->

</div>
<!-- Security Section Divider -->
<div class="pt-4 mt-6 border-t border-white/5">
<div class="flex items-center justify-between mb-4">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Security</span>
<span class="font-body-sm text-body-sm text-on-surface">Update your access credentials</span>
</div>
<button class="px-4 py-2 bg-transparent border border-white/10 rounded-lg text-on-surface font-label-lg text-label-lg hover:bg-white/5 transition-colors active:scale-95 flex items-center space-x-2" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="lock_reset">lock_reset</span>
<span class="">Change Password</span>
</button>
</div>
</div>
</form>
<!-- Actions -->
<div class="flex flex-col md:flex-row gap-4 mb-section-padding">
<button class="w-full py-4 bg-primary-container text-on-primary-container rounded-xl font-label-lg text-label-lg btn-glow hover:brightness-110 active:scale-[0.98] transition-all duration-300 uppercase tracking-widest">
                Save Changes
            </button>
<button class="w-full py-4 bg-transparent border border-surface-variant text-on-surface rounded-xl font-label-lg text-label-lg hover:bg-surface-container-highest/50 active:scale-[0.98] transition-all duration-300 uppercase tracking-widest">
                Discard
            </button>
</div>

<nav class="fixed bottom-0 w-full z-50 rounded-t-xl border-t border-white/5 bg-surface-container-low/90 backdrop-blur-2xl shadow-[0_-4px_20px_rgba(255,107,0,0.15)] flex justify-around items-center h-20 px-base pb-safe md:hidden">

<span class="material-symbols-outlined mb-1" data-icon="qr_code_scanner">qr_code_scanner</span>
<span class="font-label-md text-label-md">Scanner</span>
</a>
<!-- Orders (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant opacity-70 hover:opacity-100 transition-opacity active:scale-90 duration-150 w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="receipt_long">receipt_long</span>
<span class="font-label-md text-label-md">Orders</span>
</a>
<!-- Account (Active) -->
<a class="flex flex-col items-center justify-center text-primary-container dark:text-primary-container font-bold scale-110 transition-transform active:scale-90 duration-150 w-16 relative" href="#">
<span class="material-symbols-outlined mb-1 icon-fill drop-shadow-[0_0_8px_rgba(255,107,0,0.5)]" data-icon="person">person</span>
<span class="font-label-md text-label-md text-primary-container">Account</span>
<!-- Subtle active indicator glow -->
<div class="absolute -bottom-2 w-1/2 h-1 bg-primary-container rounded-t-full blur-[2px] opacity-70"></div>
</a>
