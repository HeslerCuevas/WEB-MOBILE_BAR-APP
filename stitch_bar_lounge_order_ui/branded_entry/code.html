<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

                    "background": "#0f131c",

                    "surface-container-low": "#181b25",
                    "surface-container-highest": "#31353f",
                    "surface-container": "#1c1f29",

                    "on-secondary-container": "#342800",
                    "tertiary": "#00daf8",

                    "outline-variant": "#5a4136",
                    "on-primary": "#561f00",

            "fontFamily": {
                    "headline": ["Epilogue"],
                    "body": ["Manrope"],
                    "label": ["Manrope"]

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-mesh {
            background: radial-gradient(at 0% 0%, rgba(255, 107, 0, 0.15) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(0, 218, 248, 0.1) 0px, transparent 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface font-body selection:bg-primary selection:text-on-primary overflow-hidden">
<!-- Splash Background with Blur -->
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 bg-surface/60 z-10 backdrop-blur-sm"></div>
<img alt="Bartender crafting cocktail" class="w-full h-full object-cover grayscale-[20%] contrast-125" data-alt="Close-up of a professional bartender's hands pouring a vibrant amber drink into a crystal glass with wisps of smoke and moody lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBMP75t_j2IVDlug8IMrn2nSNjYXztmZxxENB_Z3uePM_VSXKH-dFByQEfDUu3_EFQyIz9wET9YxskRnBOMGH9zi-sTfAxxEucRFkZJ9lW_POHdJN2a42I2F7Z1dut38RQV-HCd_hykLMZVCDD6VT6h4qB1NjAoi9ivWCieJcXHDO_0kI_-wWfviAZnSX5s1WhxDMM-vkWjGfTK5g2TTLHGCyz_6OXWaIH-b-F68stnfd2UAkwNkVBpzT6c3YpXsMmaLHR8zPs_VwE"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface via-surface/40 to-transparent z-20"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-30 h-screen w-full flex flex-col items-center justify-between px-8 py-16 md:py-24 max-w-lg mx-auto">
<!-- Brand Header Section -->
<header class="w-full text-center mt-12">
<div class="inline-block mb-4">
<span class="text-primary text-xs font-headline tracking-[0.4em] uppercase opacity-80">The Digital Sommelier</span>
</div>
<h1 class="font-headline font-black text-5xl md:text-7xl tracking-tighter text-on-surface leading-none">
                MASTER<br/>
<span class="text-primary bg-clip-text">BAR &amp; LOUNGE</span>
</h1>
<div class="mt-6 flex justify-center items-center gap-4">
<div class="h-[1px] w-8 bg-outline-variant/30"></div>
<p class="font-body text-on-surface-variant text-sm tracking-wide uppercase">Est. 2024</p>
<div class="h-[1px] w-8 bg-outline-variant/30"></div>
</div>
</header>
<!-- Action Section -->
<section class="w-full space-y-4 mb-8">
<!-- Login Button - Primary Gradient Polish -->
<button class="w-full h-16 rounded-xl bg-gradient-to-br from-primary to-primary-container text-on-primary-fixed font-headline font-bold text-lg shadow-[0_10px_30px_rgba(255,107,0,0.3)] active:scale-95 transition-all duration-200 flex items-center justify-center gap-3">
                Login
                <span class="material-symbols-outlined text-xl" data-icon="login">login</span>
</button>
<!-- Create Account Button - Soft Neomorphism/Surface High -->
<button class="w-full h-16 rounded-xl bg-surface-container-high border border-outline-variant/10 text-on-surface font-headline font-bold text-lg active:scale-95 transition-all duration-200 flex items-center justify-center gap-3">
                Create Account
                <span class="material-symbols-outlined text-xl" data-icon="person_add">person_add</span>
</button>
<!-- Secondary Options -->
<div class="pt-6 text-center">
<button class="group inline-flex items-center gap-2 text-on-surface-variant hover:text-tertiary transition-colors duration-300">
<span class="font-body text-sm font-semibold uppercase tracking-widest">Continue as Guest</span>
<span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
<!-- Footer / Policy Links -->
<footer class="w-full text-center">
<p class="text-[10px] text-on-surface-variant/40 font-body tracking-wider uppercase">
                Privacy Policy • Terms of Service
            </p>
<div class="mt-4 flex justify-center gap-2">
<div class="w-1 h-1 rounded-full bg-primary/40"></div>
<div class="w-1 h-1 rounded-full bg-primary/40"></div>
<div class="w-1 h-1 rounded-full bg-primary/40"></div>
</div>
</footer>
</main>
<!-- Decorative Texture Overlay -->
<div class="fixed inset-0 pointer-events-none z-50 opacity-[0.03] bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
</body></html>
