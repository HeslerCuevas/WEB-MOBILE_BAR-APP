<body class="bg-background text-on-background font-body min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<div class="fixed inset-0 bg-login-hero -z-10" data-alt="dimly lit luxury speakeasy bar with crystal glasses reflecting soft warm amber light and deep blue shadows"></div>
<div class="w-full max-w-md px-6 py-12">
<header class="text-center mb-12">
<h1 class="font-headline font-black text-4xl tracking-tighter text-primary mb-2">NOCTURNAL</h1>
<p class="font-body text-on-surface-variant text-sm uppercase tracking-[0.2em] font-medium">Master Bar &amp; Lounge</p>
</header>
<main class="glass-panel p-8 rounded-[2rem] shadow-[0_20px_50px_rgba(0,0,0,0.5)] relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary-container to-transparent opacity-30"></div>
<div class="mb-8">
<h2 class="font-headline text-2xl font-bold text-on-surface mb-1">Welcome back</h2>
<p class="text-on-surface-variant text-sm">Enter your credentials to access the lounge.</p>
</div>
<form action="#" class="space-y-6">
<div class="space-y-1.5">
<label class="font-label text-xs font-semibold uppercase tracking-wider text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-tertiary transition-colors">alternate_email</span>
<input class="w-full bg-surface-container-lowest border-none rounded-xl py-4 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-tertiary/30 transition-all outline-none" id="email" placeholder="name@domain.com" type="email"/>
</div>
</div>
<div class="space-y-1.5">
<div class="flex justify-between items-center px-1">
<label class="font-label text-xs font-semibold uppercase tracking-wider text-on-surface-variant" for="password">Password</label>
<a class="text-xs text-secondary hover:text-primary transition-colors font-semibold" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-tertiary transition-colors">lock</span>
<input class="w-full bg-surface-container-lowest border-none rounded-xl py-4 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-tertiary/30 transition-all outline-none" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold py-4 rounded-xl shadow-[0_8px_20px_rgba(255,107,0,0.3)] hover:shadow-[0_12px_24px_rgba(255,107,0,0.4)] hover:scale-[1.02] active:scale-95 transition-all duration-300 flex items-center justify-center gap-2" type="submit">
                    Login to Lounge
                </button>
</form>
<div class="relative my-10 text-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<span class="relative px-4 text-xs font-bold uppercase tracking-widest text-on-surface-variant/60 bg-surface-container-high/40 rounded-full py-1">or continue with</span>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 bg-surface-container-high/50 hover:bg-surface-container-high border border-outline-variant/10 py-3 rounded-xl transition-all group">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>

<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-sm font-semibold group-hover:text-tertiary transition-colors">Google</span>
</button>

<svg class="w-5 h-5 text-on-surface" fill="currentColor" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.96.95-2.18 1.72-3.66 1.72-1.39 0-2.43-.82-3.84-.82-1.41 0-2.66.86-3.84.86-1.32 0-2.68-.83-3.76-1.98-2.24-2.38-2.9-6.42-1.33-8.89 1.13-1.78 2.92-2.87 4.71-2.87.97 0 2.06.53 2.98.53.92 0 1.94-.55 3.09-.55 1.57 0 3.12.87 4.09 2.18-3.17 1.66-2.66 5.86.37 7.04-.63 1.34-1.44 2.58-2.81 3.78zm-3.07-16.71c.88-.95 1.48-2.27 1.48-3.57 0-.18-.02-.36-.05-.53-1.28.05-2.83.84-3.75 1.91-.83.95-1.57 2.3-1.57 3.59 0 .19.03.39.07.52 1.34.02 2.92-.85 3.82-1.92z"></path>
</svg>
<span class="text-sm font-semibold group-hover:text-tertiary transition-colors">Apple</span>
</button>
</div>
</main>
<footer class="mt-8 text-center">
<p class="text-on-surface-variant text-sm">
                Don't have an account?

</p>
