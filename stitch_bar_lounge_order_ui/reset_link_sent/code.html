<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;700;900&amp;family=Manrope:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ffb4ab",
                        "surface-container-lowest": "#0a0e17",
                        "tertiary-container": "#00a8c0",
                        "inverse-surface": "#dfe2ef",
                        "tertiary-fixed-dim": "#00daf8",
                        "surface-container": "#1c1f29",
                        "error-container": "#93000a",
                        "primary": "#ffb693",
                        "surface-container-high": "#262a34",
                        "primary-fixed-dim": "#ffb693",
                        "surface-container-low": "#181b25",
                        "inverse-primary": "#a04100",
                        "tertiary-fixed": "#a5eeff",
                        "on-secondary": "#3c2f00",
                        "surface-bright": "#353943",
                        "secondary-container": "#af8d11",
                        "on-surface": "#dfe2ef",
                        "on-tertiary-fixed-variant": "#004e5a",
                        "surface": "#0f131c",
                        "on-tertiary": "#00363f",
                        "tertiary": "#00daf8",
                        "on-primary-container": "#572000",
                        "on-secondary-container": "#342800",
                        "secondary": "#e9c349",
                        "outline": "#a98a7d",
                        "surface-container-highest": "#31353f",
                        "primary-container": "#ff6b00",
                        "on-primary-fixed-variant": "#7a3000",
                        "surface-tint": "#ffb693",
                        "outline-variant": "#5a4136",
                        "on-secondary-fixed": "#241a00",
                        "on-tertiary-container": "#003740",
                        "background": "#0f131c",
                        "on-background": "#dfe2ef",
                        "secondary-fixed-dim": "#e9c349",
                        "on-secondary-fixed-variant": "#574500",
                        "on-surface-variant": "#e2bfb0",
                        "on-primary": "#561f00",
                        "surface-variant": "#31353f",
                        "on-tertiary-fixed": "#001f25",
                        "on-primary-fixed": "#351000",
                        "secondary-fixed": "#ffe088",
                        "primary-fixed": "#ffdbcc",
                        "on-error-container": "#ffdad6",
                        "on-error": "#690005",
                        "inverse-on-surface": "#2c303a",
                        "surface-dim": "#0f131c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Epilogue"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .premium-blur {
            backdrop-filter: blur(20px);
            background: rgba(38, 42, 52, 0.2);
        }
        .glow-shadow {
            box-shadow: 0 0 30px rgba(255, 182, 147, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary selection:text-on-primary">
<header class="w-full top-0 sticky bg-[#0f131c] z-50">
<div class="flex items-center justify-between px-6 py-4 w-full shadow-[0_20px_40px_rgba(24,27,37,0.4)] bg-[#181b25]">
<div class="flex items-center gap-4">
<button class="text-[#ffb693] active:scale-95 transition-transform hover:bg-[#262a34] transition-colors duration-300 p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-[#ffb693] font-['Epilogue'] font-black tracking-widest uppercase">The Nocturnal</h1>
</div>
<div class="hidden md:flex gap-8">
<a class="text-[#dfe2ef] font-['Epilogue'] tracking-tight font-bold hover:bg-[#262a34] transition-colors duration-300 px-3 py-1 rounded" href="#">Login</a>
<a class="text-[#dfe2ef] font-['Epilogue'] tracking-tight font-bold hover:bg-[#262a34] transition-colors duration-300 px-3 py-1 rounded" href="#">Help</a>
<a class="text-[#dfe2ef] font-['Epilogue'] tracking-tight font-bold hover:bg-[#262a34] transition-colors duration-300 px-3 py-1 rounded" href="#">Info</a>
</div>
</div>
</header>
<main class="min-h-[calc(100vh-160px)] flex items-center justify-center px-6 py-12 relative overflow-hidden">
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-primary/5 rounded-full blur-[120px] pointer-events-none"></div>
<div class="max-w-md w-full relative z-10">
<div class="bg-surface-container-low rounded-xl p-8 md:p-12 text-center shadow-2xl premium-blur border border-outline-variant/10">
<div class="mb-10 inline-flex items-center justify-center w-24 h-24 rounded-full bg-gradient-to-br from-primary to-primary-container glow-shadow">
<span class="material-symbols-outlined text-on-primary-container text-5xl" data-icon="mark_email_read">mark_email_read</span>
</div>
<h2 class="font-headline text-3xl font-bold text-on-surface mb-4 tracking-tight">Check your inbox</h2>
<p class="text-on-surface-variant font-body text-lg mb-10 leading-relaxed">
                    We've sent a password reset link to your registered email. Please follow the instructions to secure your <span class="text-secondary font-semibold">Master Bar &amp; Lounge</span> account.
                </p>
<div class="flex flex-col gap-4">
<button class="bg-gradient-to-br from-primary to-primary-container text-on-primary-container font-headline font-bold py-4 px-8 rounded-xl shadow-lg active:scale-[0.98] transition-all hover:brightness-110">
                        Open Email App
                    </button>
<button class="bg-surface-container-high text-on-surface-variant font-headline font-semibold py-4 px-8 rounded-xl border border-outline-variant/20 active:scale-[0.98] transition-all hover:bg-surface-bright hover:text-on-surface">
                        Back to Login
                    </button>
</div>
<div class="mt-12 pt-8 border-t border-outline-variant/10">
<p class="text-on-surface-variant text-sm font-medium">
                        Didn't receive the email? 
                        <a class="text-secondary hover:text-secondary-fixed-dim transition-colors ml-1 underline underline-offset-4 decoration-secondary/30" href="#">Resend Link</a>
</p>
</div>
</div>
<div class="mt-12 grid grid-cols-2 gap-4">
<div class="bg-surface-container-low/50 p-4 rounded-xl flex items-center gap-3">
<span class="material-symbols-outlined text-secondary" data-icon="security">security</span>
<span class="text-xs text-on-surface-variant font-medium">End-to-End Encryption</span>
</div>
<div class="bg-surface-container-low/50 p-4 rounded-xl flex items-center gap-3">
<span class="material-symbols-outlined text-secondary" data-icon="timer">timer</span>
<span class="text-xs text-on-surface-variant font-medium">Link expires in 15m</span>
</div>
</div>
</div>
</main>
</body></html>
